name: Deploy Static Website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Verify Required Web Files (Challenge Requirement)
        run: |
          echo "Verifying project structure..."
          test -f index.html || { echo "Error: index.html missing"; exit 1; }
          test -f style.css || { echo "Error: style.css missing"; exit 1; }
          test -f script.js || { echo "Error: script.js missing"; exit 1; }
          echo "All required files verified successfully!"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
